[package]
name = "taskhud"
version = "0.1.0"
description = "A local-first task HUD for projects using AI agents"
authors = ["Quentin Hamonic"]
license = "MIT"
repository = "https://github.com/QuentinHamonic/ArkaDoThat"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "taskhud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
taskhud-core = { path = "../crates/taskhud-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
