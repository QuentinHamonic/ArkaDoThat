[package]
name = "taskhud-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "taskhud-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskhud-core = { path = "../taskhud-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
